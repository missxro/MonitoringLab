---
- name: Mapear arquitectura del host al nombre usado por los releases de node_exporter
  set_fact:
    _ne_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

- name: Usuario de sistema dedicado
  user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Comprobar versión instalada (si existe binario)
  stat:
    path: /usr/local/bin/node_exporter
  register: _ne_bin

- name: Leer versión del binario instalado
  command: /usr/local/bin/node_exporter --version
  register: _ne_installed_version
  changed_when: false
  failed_when: false
  when: _ne_bin.stat.exists

- name: Descargar e instalar node_exporter {{ lab.versions.node_exporter }}
  when: >
    not _ne_bin.stat.exists or
    (lab.versions.node_exporter not in (_ne_installed_version.stdout | default('')))
  block:
    - name: Descargar el tarball oficial
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ lab.versions.node_exporter }}/node_exporter-{{ lab.versions.node_exporter }}.linux-{{ _ne_arch }}.tar.gz"
        dest: "/tmp/node_exporter-{{ lab.versions.node_exporter }}.tar.gz"
        mode: "0644"

    - name: Extraer
      unarchive:
        src: "/tmp/node_exporter-{{ lab.versions.node_exporter }}.tar.gz"
        dest: /opt
        remote_src: true

    - name: Instalar el binario en /usr/local/bin
      copy:
        src: "/opt/node_exporter-{{ lab.versions.node_exporter }}.linux-{{ _ne_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: reiniciar node_exporter

    - name: Limpiar tarball
      file:
        path: "/tmp/node_exporter-{{ lab.versions.node_exporter }}.tar.gz"
        state: absent

- name: Unidad systemd
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: reiniciar node_exporter

- name: Habilitar y arrancar node_exporter
  systemd:
    name: node_exporter
    daemon_reload: true
    enabled: true
    state: started
